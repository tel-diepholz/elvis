name: ELVIS lite (Windows)

on:
  push:
    branches: [main]
    paths: ['apps/**', 'packages/**', 'package-lock.json', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['apps/**', 'packages/**', 'package-lock.json', '.github/workflows/desktop.yml']
  workflow_dispatch:

jobs:
  test:
    name: Tests unter Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  installer:
    name: Installer bauen
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist -w @elvis/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: elvis-lite-installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error
