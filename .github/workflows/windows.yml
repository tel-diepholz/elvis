name: ELVIS lite (Windows)

on:
  push:
    branches: [main]
    paths: ['apps/**', 'packages/**', 'package-lock.json', '.github/workflows/windows.yml']
  pull_request:
    paths: ['apps/**', 'packages/**', 'package-lock.json', '.github/workflows/windows.yml']
  workflow_dispatch:

jobs:
  test:
    name: Tests unter Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Addon-Tests lesen die Manifeste aus dem Submodul
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  installer:
    name: Installer bauen
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: NSIS bereitstellen
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { choco install nsis -y --no-progress }
      - run: npm run dist -w @elvis/windows
      - uses: actions/upload-artifact@v4
        with:
          name: elvis-lite-installer
          path: apps/windows/release/*.exe
          if-no-files-found: error
