<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  ELVIS darf BlueZ (bluetoothd) über den System-Bus ansprechen, um Bluetooth-Geräte mitzulesen.
  Der ELVIS-Container läuft als Benutzer „node“ mit der UID 1000; D-Bus sieht diese UID auf dem Host.
  Installation: sudo cp deploy/bluetooth/elvis-bluetooth.conf /etc/dbus-1/system.d/ && sudo systemctl reload dbus
-->
<busconfig>
  <policy user="1000">
    <allow send_destination="org.bluez"/>
  </policy>
</busconfig>
