# ELVIS auf einem Server. Kein Docker-Socket: Docker-Hosts (auch dieser Server) werden über die
# Docker-API per TLS angebunden – siehe deploy/install.sh.
# Nicht für eigene Anpassungen ändern – die gehören in compose.override.yaml (Vorlage:
# compose.override.example.yaml), sonst blockieren sie `git pull`.
services:
  elvis:
    image: elvis:latest
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    container_name: elvis
    restart: unless-stopped
    ports:
      - "8080:8080"
      # Scan-Eingang: SMTP für „Scan an E-Mail“ der Multifunktionsgeräte
      - "2525:2525"
    volumes:
      - elvis-data:/data
      - elvis-config:/config
    # Hardware dieses Fahrzeugs (Airmar, Bluetooth …) gehört in deploy/compose.override.yaml,
    # Vorlage: deploy/compose.override.example.yaml

volumes:
  elvis-data:
  elvis-config:
